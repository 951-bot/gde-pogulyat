<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пешие маршруты Кирова</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #161618;
            --accent-color: #2f80ed;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --border-color: #2c2c2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            height: 100vh;
        }

        .sidebar {
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            padding: 32px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .routes-list {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .route-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .route-card:hover, .route-card.active {
            border-color: var(--accent-color);
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #111;
        }

        .slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .slide.active {
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
            transition: background 0.2s;
        }

        .slider-btn:hover { background: rgba(0, 0, 0, 0.8); }
        .slider-btn.prev { left: 10px; border-radius: 4px; }
        .slider-btn.next { right: 10px; border-radius: 4px; }

        .route-content {
            padding: 20px;
        }

        .route-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .route-desc {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-muted);
            margin: 0;
        }

        .map-container {
            width: 100%;
            height: 100%;
            background: #111;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .admin-panel {
            display: none;
            padding: 24px;
            background: var(--card-bg);
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .admin-box {
            max-width: 600px;
            margin: 40px auto;
            background: var(--bg-color);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
        }

        .btn-close {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-left: 10px;
        }

        @media (max-width: 900px) {
            .layout { display: flex; flex-direction: column; height: auto; }
            .map-container { width: 100%; height: 350px; position: sticky; top: 0; z-index: 100; }
            .sidebar { width: 100%; height: auto; border-right: none; }
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <div class="header">
            <h1>Маршруты Кирова</h1>
            <p>Пешие тропы и природные зоны</p>
        </div>
        <div class="routes-list" id="routes-list"></div>
    </div>
    <div class="map-container" id="map-window"></div>
</div>

<div class="admin-panel" id="admin-panel">
    <div class="admin-box" id="auth-box">
        <h2 style="margin-top:0;">Вход в управление</h2>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="username" class="form-control">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" class="form-control">
        </div>
        <button class="btn" onclick="login()">Войти</button>
        <button class="btn btn-close" onclick="closeAdmin()">Отмена</button>
    </div>

    <div class="admin-box" id="form-box" style="display: none;">
        <h2 style="margin-top:0;">Добавить новый маршрут</h2>
        <div class="form-group">
            <label>Название тропы</label>
            <input type="text" id="route-name" class="form-control" placeholder="Заречный парк">
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea id="route-desc-input" class="form-control" rows="3" placeholder="Описание тропы..."></textarea>
        </div>
        <div class="form-group">
            <label>Координаты на карте (Широта, Долгота)</label>
            <input type="text" id="route-coords" class="form-control" placeholder="58.6080, 49.7042">
        </div>
        <div class="form-group">
            <label>Ссылки на фото (через запятую)</label>
            <input type="text" id="route-photos" class="form-control" placeholder="ссылка1, ссылка2">
        </div>
        <button class="btn" onclick="saveRoute()">Сохранить маршрут</button>
        <button class="btn btn-close" onclick="closeAdmin()">Выйти</button>
    </div>
</div>
<script>
    const defaultData = {
        "routes": [
            {
                "id": 1,
                "name": "Заречный парк",
                "description": "Памятник природы на левом берегу Вятки. Живописный сосновый бор, чистый воздух и деревянные пешеходные настилы для комфортных прогулок на 3 км.",
                "coords": [58.6080, 49.7042],
                "photos": [
                    "https://unsplash.com", 
                    "https://unsplash.com"
                ]
            },
            {
                "id": 2,
                "name": "Северная набережная",
                "photos": [
                    "https://unsplash.com",
                    "https://unsplash.com"
                ],
                "description": "Район Филейки, Северной больницы и спортивного Трамплина. Высокий берег реки Вятки, открывающий красивый панорамный вид на заречные дали.",
                "coords": [58.6346, 49.6384]
            },
            {
                "id": 3,
                "name": "Экотропы в Порошино",
                "description": "Обустроенные лесные просеки разной протяженности от 1 до 5 км. Отличное место жителей города для бега, прогулок выходного дня и зимних лыж.",
                "coords": [58.6358, 49.8037],
                "photos": [
                    "https://unsplash.com",
                    "https://unsplash.com"
                ]
            },
            {
                "id": 4,
                "name": "Вятская большая тропа",
                "description": "Протяженный природный трек. Старт в черте города начинается от слободы Дымково у старого моста и идет вдоль русла реки в сторону Малой Субботихи.",
                "coords": [58.6044, 49.6953],
                "photos": [
                    "https://unsplash.com",
                    "https://unsplash.com"
                ]
            }
        ]
    };

    function getRoutes() {
        const local = localStorage.getItem('kirov_routes_yandex_embed_v1');
        if (!local || JSON.parse(local).routes.length < 4) {
            localStorage.setItem('kirov_routes_yandex_embed_v1', JSON.stringify(defaultData));
            return defaultData;
        }
        return JSON.parse(local);
    }

    function renderContent() {
        const data = getRoutes();
        const list = document.getElementById('routes-list');
        list.innerHTML = '';

        data.routes.forEach((route, rIdx) => {
            const card = document.createElement('div');
            card.className = 'route-card';
            card.onclick = () => selectRoute(route.coords, card);

            let sliderHTML = '';
            if (route.photos && route.photos.length > 0) {
                sliderHTML = `<div class="slider-container" id="slider-${rIdx}">`;
                route.photos.forEach((p, pIdx) => {
                    sliderHTML += `<img src="${p}" class="slide ${pIdx === 0 ? 'active' : ''}" alt="">`;
                });
                if (route.photos.length > 1) {
                    sliderHTML += `
                        <button class="slider-btn prev" onclick="changeSlide(${rIdx}, -1); event.stopPropagation();">←</button>
                        <button class="slider-btn next" onclick="changeSlide(${rIdx}, 1); event.stopPropagation();">→</button>
                    `;
                }
                sliderHTML += `</div>`;
            }

            card.innerHTML = `
                ${sliderHTML}
                <div class="route-content">
                    <h2 class="route-title">${route.name}</h2>
                    <p class="route-desc">${route.description}</p>
                </div>
            `;
            list.appendChild(card);
            
            if (rIdx === 0) {
                card.classList.add('active');
                selectRoute(route.coords, card);
            }
        });
    }

    function changeSlide(routeIdx, direction) {
        const container = document.getElementById(`slider-${routeIdx}`);
        const slides = container.getElementsByClassName('slide');
        let activeIdx = 0;
        
        for (let i = 0; i < slides.length; i++) {
            if (slides[i].classList.contains('active')) {
                activeIdx = i;
                break;
            }
        }

        slides[activeIdx].classList.remove('active');
        let newIdx = activeIdx + direction;
        if (newIdx >= slides.length) newIdx = 0;
        if (newIdx < 0) newIdx = slides.length - 1;
        slides[newIdx].classList.add('active');
    }
</script>
<script>
    function selectRoute(coords, cardElement) {
        const cards = document.getElementsByClassName('route-card');
        for(let i=0; i<cards.length; i++) {
            cards[i].classList.remove('active');
        }
        if (cardElement) cardElement.classList.add('active');

        const mapContainer = document.getElementById('map-window');
        // Извлекаем широту и долготу из массива
        const lat = coords[0];
        const lng = coords[1];
        
        // Используем полностью стабильный бесплатный iframe Яндекс Карт
        mapContainer.innerHTML = `
            <iframe 
                src="https://yandex.ru{lng},${lat}&z=14&pt=${lng},${lat},pm2blm" 
                allowfullscreen="true">
            </iframe>
        `;
    }

    function checkAdminRoute() {
        const path = window.location.pathname;
        if (path === '/admin' || path === '/admin/' || window.location.hash === '#admin') {
            document.getElementById('admin-panel').style.display = 'block';
        }
    }

    window.addEventListener('popstate', checkAdminRoute);
    window.addEventListener('load', () => {
        renderContent();
        checkAdminRoute();
    });

    function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if (u === 'admin' && p === 'admin') {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('form-box').style.display = 'block';
        } else {
            alert('Неверный логин или пароль');
        }
    }

    function saveRoute() {
        const name = document.getElementById('route-name').value;
        const desc = document.getElementById('route-desc-input').value;
        const coordsStr = document.getElementById('route-coords').value;
        const photosStr = document.getElementById('route-photos').value;

        if (!name || !desc || !coordsStr) {
            alert('Заполните обязательные поля');
            return;
        }

        const coords = coordsStr.split(',').map(c => parseFloat(c.trim()));
        const photos = photosStr ? photosStr.split(',').map(p => p.trim()) : [];

        const currentData = getRoutes();
        const newRoute = {
            id: Date.now(),
            name: name,
            description: desc,
            coords: coords,
            photos: photos
        };

        currentData.routes.push(newRoute);
        localStorage.setItem('kirov_routes_yandex_embed_v1', JSON.stringify(currentData));
        
        renderContent();
        closeAdmin();
        alert('Маршрут успешно добавлен!');
    }

    function closeAdmin() {
        document.getElementById('admin-panel').style.display = 'none';
        window.history.pushState({}, '', '/');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }
</script>
</body>
</html>
